[package]
name = "obsidian-hub"
version = "0.1.0"
description = "A fast launcher for Obsidian vaults"
authors = ["Obsidian Hub contributors"]
edition = "2024"

[lib]
name = "obsidian_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
url = "2"
axum = "0.8"
rand = "0.9"
tokio = { version = "1", features = ["net", "sync"] }
